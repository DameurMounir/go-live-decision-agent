[build-system]
requires = ["setuptools==81.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "go-live-decision-agent"
version = "0.1.0"
description = "Evidence-bound PASS, BLOCKED, or FAIL release-readiness decisions with human confirmation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA", "NOTICE"]
authors = [{ name = "Mounir Dameur" }]
keywords = [
  "business-analysis",
  "go-live",
  "release-readiness",
  "decision-support",
  "human-in-the-loop",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
ui = ["streamlit==1.61.1"]

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "build==1.5.0",
  "detect-secrets==1.5.0",
  "mypy==1.20.2",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
  "twine==6.2.0",
]

[project.scripts]
go-live-decision-agent = "go_live_decision_agent.cli:main"

[project.urls]
Homepage = "https://github.com/DameurMounir/go-live-decision-agent"
Repository = "https://github.com/DameurMounir/go-live-decision-agent"
Issues = "https://github.com/DameurMounir/go-live-decision-agent/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
go_live_decision_agent = ["py.typed", "sample_cases/**/*.json", "policy/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = "src"
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "evaluation", ".venv"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["go_live_decision_agent"]
omit = [
  "src/go_live_decision_agent/ui.py",
  "src/go_live_decision_agent/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
